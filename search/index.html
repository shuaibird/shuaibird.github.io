    // Ensure only one <details> dropdown is open at a time.
    const menus = Array.from(

    for (const menu of menus) {
      menu.addEventListener("toggle", () => {
        if (!menu.open) return;
        for (const other of menus) {
          if (other !== menu) other.open = false;
        }
      });
    }

    const header = document.querySelector(".site-header");
    const toggleButton = header?.querySelector(".nav-toggle");
    const closeButton = header?.querySelector(".nav-close");
    const backdrop = header?.querySelector(".nav-backdrop");

    const setNavOpen = (open) => {
      if (!header) return;
      header.classList.toggle("nav-open", open);
      if (toggleButton instanceof HTMLElement) {
        toggleButton.setAttribute("aria-expanded", open ? "true" : "false");
      }
      const scrollbarWidth =
        window.innerWidth - document.documentElement.clientWidth;
      document.body.style.overflow = open ? "hidden" : "";
      document.body.style.paddingRight = open ? `${scrollbarWidth}px` : "";
    };

    toggleButton?.addEventListener("click", () => {
      const isOpen = header?.classList.contains("nav-open");
      setNavOpen(!isOpen);
    });

    closeButton?.addEventListener("click", () => setNavOpen(false));
    backdrop?.addEventListener("click", () => setNavOpen(false));

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (!header?.classList.contains("nav-open")) return;
      setNavOpen(false);
    });

    // Close any open menu when selecting a dropdown item.
    header?.addEventListener("click", (e) => {
      const target = e.target;
      if (!(target instanceof Element)) return;

      const link = target.closest("a");
      if (!link) return;

      const inPanel = link.closest(".menu-panel");
      if (inPanel) {
        for (const menu of menus) menu.open = false;
      }

      setNavOpen(false);
    });

    const progressEnabled =
      header instanceof HTMLElement &&
      header.classList.contains("has-progress");

    if (progressEnabled && header instanceof HTMLElement) {
      let ticking = false;

      const updateProgress = () => {
        const doc = document.documentElement;
        const scrollTop = window.scrollY || doc.scrollTop;
        const maxScroll = doc.scrollHeight - window.innerHeight;
        const progress =
          maxScroll <= 0 ? 0 : Math.min(Math.max(scrollTop / maxScroll, 0), 1);

        header.style.setProperty("--header-progress", progress.toFixed(4));
        header.style.setProperty(
          "--header-progress-percent",
          `${(progress * 100).toFixed(2)}%`,
        );
        header.classList.toggle("progress-ready", maxScroll > 0);
      };

      const requestUpdate = () => {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(() => {
          updateProgress();
          ticking = false;
        });
      };

      updateProgress();
      window.addEventListener("scroll", requestUpdate, { passive: true });
      window.addEventListener("resize", requestUpdate);
      window.addEventListener("load", updateProgress);
    }

const pagefindBase = "/pagefind/";

    const form = document.querySelector(".search-form");
    const input = document.querySelector(".search-input");
    const statusEl = document.querySelector(".search-status");
    const resultsEl = document.querySelector(".search-results");

    let pagefindPromise = null;
    let activeSearchId = 0;

    const setStatus = (message) => {
      if (!statusEl) return;
      statusEl.textContent = message;
    };

    const setResultsEmpty = (isEmpty) => {
      if (!resultsEl) return;
      resultsEl.dataset.empty = isEmpty ? "true" : "false";
    };

    const loadPagefind = async () => {
      if (pagefindPromise) return pagefindPromise;
      pagefindPromise = import(`${pagefindBase}pagefind.js`)
        .then(async (module) => {
          if (module?.options) {
            await module.options({ basePath: pagefindBase });
          }
          return module;
        })
        .catch(() => null);
      return pagefindPromise;
    };

    const updateUrl = (query) => {
      const url = new URL(window.location.href);
      if (query) {
        url.searchParams.set("q", query);
      } else {
        url.searchParams.delete("q");
      }
      window.history.replaceState({}, "", url);
    };

    const renderResults = (entries) => {
      if (!resultsEl) return;
      resultsEl.innerHTML = "";

      if (!entries.length) {
        setResultsEmpty(true);
        resultsEl.innerHTML =
          '<div class="search-empty">No matches yet. Try a different phrase.</div>';
        return;
      }

      setResultsEmpty(false);
      const fragment = document.createDocumentFragment();

      for (const entry of entries) {
        const item = document.createElement("article");
        item.className = "search-item";

        const categoryLine = document.createElement("div");
        categoryLine.className = "search-category";
        const series = entry?.meta?.series;
        const collection = entry?.meta?.collection;

        if (series) {
          categoryLine.textContent = series;
        } else if (collection) {
          categoryLine.textContent = collection;
        }

        const titleLink = document.createElement("a");
        titleLink.className = "search-title";
        titleLink.href = entry.url;
        titleLink.textContent = entry?.meta?.title || entry?.title || entry.url;

        const summary = document.createElement("p");
        summary.className = "search-summary";

        if (entry?.meta?.summary) {
          summary.textContent = entry.meta.summary;
        } else if (entry?.excerpt) {
          summary.innerHTML = entry.excerpt;
        }

        if (categoryLine.textContent) {
          item.appendChild(categoryLine);
        }
        item.appendChild(titleLink);
        if (summary.textContent || summary.innerHTML) {
          item.appendChild(summary);
        }
        fragment.appendChild(item);
      }

      resultsEl.appendChild(fragment);
    };

    const runSearch = async (query) => {
      const searchId = ++activeSearchId;
      const trimmed = query.trim();

      updateUrl(trimmed);

      if (!trimmed) {
        setStatus("Type a query to search.");
        renderResults([]);
        return;
      }

      setStatus(`Searching "${trimmed}"...`);
      const pagefind = await loadPagefind();

      if (!pagefind) {
        setStatus(
          isDev
            ? "Search is available after running a production build."
            : "Search index missing. Run the build to generate it.",
        );
        return;
      }

      let response;
      try {
        response = await pagefind.search(trimmed);
      } catch {
        setStatus("Search index failed to load.");
        if (resultsEl) resultsEl.innerHTML = "";
        return;
      }
      if (searchId !== activeSearchId) return;

      const results = await Promise.all(
        response.results.slice(0, 12).map((result) => result.data()),
      );

      renderResults(results);
      setStatus(
        response.results.length
          ? `Showing ${results.length} of ${response.results.length} results for "${trimmed}".`
          : "No results found.",
      );
    };

    let debounceTimer = null;

    const queueSearch = (value) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => runSearch(value), 320);
    };

    form?.addEventListener("submit", (event) => {
      event.preventDefault();
    });

    input?.addEventListener("input", (event) => {
      queueSearch(event.target.value || "");
    });

    const initialQuery =
      new URLSearchParams(window.location.search).get("q") || "";
    if (input) {
      input.value = initialQuery;
    }

    runSearch(initialQuery);
  })();</script>   </main>   </body> </html>
